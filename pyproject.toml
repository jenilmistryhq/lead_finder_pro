[project]
name = "lead-finder"
version = "1.0.0"
description = "Fetch and score public business leads for SEO/Google-Ads outreach — free via OpenStreetMap by default, or via the Google Places API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# TODO: replace with your real name/email before publishing
authors = [
    { name = "Jenil" },
]
keywords = ["leads", "lead-generation", "seo", "sales", "openstreetmap", "google-places", "b2b", "prospecting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dotenv = ["python-dotenv>=1.0"]
dev = ["pytest>=7.4"]

[project.scripts]
lead-finder = "lead_finder.cli:run"

# TODO: replace jenilmistryhq once the repo is created
[project.urls]
Homepage = "https://github.com/jenilmistryhq/lead-finder"
Repository = "https://github.com/jenilmistryhq/lead-finder"
Issues = "https://github.com/jenilmistryhq/lead-finder/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
